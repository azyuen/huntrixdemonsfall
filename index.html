<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09051a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HUNTR/X: Demons Fall — V2</title>
  <style>
    html, body, #app { margin:0; width:100%; height:100%; overflow:hidden; background:#09051a; touch-action:none; user-select:none; }
    body { position:fixed; inset:0; }
    #app { display:flex; align-items:center; justify-content:center; }
    canvas { display:block; max-width:100%; max-height:100%; }
    #status, #rotate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:#fff; background:#09051a; font:600 22px system-ui,sans-serif; z-index:10; }
    #rotate { display:none; }
    #build { position:fixed; right:max(10px,env(safe-area-inset-right)); bottom:max(8px,env(safe-area-inset-bottom)); padding:5px 8px; border-radius:7px; background:rgba(18,10,45,.82); color:#d8cfff; font:700 10px system-ui,sans-serif; letter-spacing:.6px; z-index:20; pointer-events:none; }
    @media (orientation:portrait) and (max-width:900px) { #rotate { display:flex; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="status">Loading clean V2…</div>
  <div id="rotate">Rotate your device to landscape.</div>
  <div id="build">V2 • MILESTONE 3</div>
  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('status');
      if (status) status.textContent = `Game error: ${event.message || 'Unknown error'}`;
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('status');
      const reason = event.reason?.message || event.reason || 'Unhandled promise rejection';
      if (status) status.textContent = `Game error: ${reason}`;
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
