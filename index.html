<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HUNTR/X: Demons Fall</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#09051a;touch-action:none}
    canvas{display:block;margin:auto}
    #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;color:#fff;background:#09051a;font:600 24px system-ui;text-align:center;padding:24px}
    #status small{display:block;margin-top:12px;font:400 14px system-ui;color:#bdb4d8}
    #rotate{display:none;position:fixed;inset:0;z-index:10;background:#09051a;color:white;align-items:center;justify-content:center;text-align:center;font:600 22px system-ui;padding:32px}
    @media(orientation:portrait) and (max-width:900px){#rotate{display:flex}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="status">Loading HUNTR/X: Demons Fall…<small>If this message remains, the game script did not start.</small></div>
  <div id="rotate">Rotate your device to landscape to play.</div>
  <script>
    window.addEventListener('error', function (e) {
      var s=document.getElementById('status');
      if(s){s.innerHTML='Game error:<br><small>'+String(e.message||'Unknown error')+'</small>';}
    });
    window.addEventListener('unhandledrejection', function (e) {
      var s=document.getElementById('status');
      if(s){s.innerHTML='Game error:<br><small>'+String((e.reason&&e.reason.message)||e.reason||'Unhandled promise rejection')+'</small>';}
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
